services:
  - type: web
    name: ais-smartclass-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DEMO_STUDENT_USERNAME
        value: IsraKhan
      - key: DEMO_TEACHER_USERNAME
        value: YasirKhan
      - key: DEMO_STUDENT_PASSWORD
        sync: false
      - key: DEMO_TEACHER_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: LOG_LEVEL
        value: INFO