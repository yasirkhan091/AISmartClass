services:
  - type: web
    name: ais-smartclass-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DEMO_STUDENT_PASSWORD
        sync: false
      - key: DEMO_TEACHER_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: openrouter
      - key: OPEN_ROUTER_API_KEY
        sync: false
      - key: OPEN_ROUTER_MODEL
        value: openrouter/free
      - key: ADMIN_USERNAME
        value: schooladmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: INFO